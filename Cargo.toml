[workspace]
resolver = "3"
members = [
  "crates/saladfingers-api",
  "crates/saladfingers-protocol",
  "crates/saladfingers-agent",
  "crates/saladfingers-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0 OR BSD-3-Clause"
# The smaller of the flake's two Rust toolchains — nixpkgs-native rustc (nixos-unstable,
# 1.96.1) vs the rust-overlay stable used by CI (1.97.1) — so an upstream nixpkgs build
# with its own compiler satisfies the MSRV.
rust-version = "1.96"

[workspace.dependencies]
saladfingers-api = { path = "crates/saladfingers-api" }
saladfingers-protocol = { path = "crates/saladfingers-protocol" }

# CLI / config
clap = { version = "4", features = ["derive", "env"] }
comfy-table = "7"
humantime = "2"

# async / http
tokio = { version = "1" }
tokio-util = { version = "0.7" }
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
  "stream",
] }
axum = "0.8"
futures-util = "0.3"
bytes = "1"

# serde / data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "serde",
] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
base64 = "0.22"

# storage / transfer
rusty-s3 = "0.10"
url = "2"
tar = "0.4"
zstd = "0.13"
sha2 = "0.11"

# errors / logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# misc
getrandom = "0.4"
glob = "0.3"
libloading = "0.9"
libc = "0.2"

# dev
wiremock = "0.6"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
