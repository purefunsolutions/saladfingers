[workspace]
resolver = "3"
members = [
  "crates/saladfingers-api",
  "crates/saladfingers-protocol",
  "crates/saladfingers-agent",
  "crates/saladfingers-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0 OR BSD-3-Clause"
# NixOS 26.11's rustc, so a build with that release's own compiler satisfies the MSRV.
# 26.11 branches off nixos-unstable, which already ships 1.99.1, so the release has at
# least 1.99; recheck once it is out, since it may ship 1.100. CI's rust-overlay stable
# and the flake's nixpkgs rustc are both 1.99.1. Raising this lets cargo's MSRV-aware
# resolver (resolver 3) pick dependency releases that need up to this version.
rust-version = "1.99"

[workspace.dependencies]
saladfingers-api = { path = "crates/saladfingers-api" }
saladfingers-protocol = { path = "crates/saladfingers-protocol" }

# CLI / config
clap = { version = "4", features = ["derive", "env"] }
comfy-table = "7"
humantime = "2"

# async / http
tokio = { version = "1" }
tokio-util = { version = "0.7" }
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
  "stream",
] }
axum = "0.8"
futures-util = "0.3"
bytes = "1"

# serde / data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "serde",
] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
base64 = "0.22"

# storage / transfer
rusty-s3 = "0.10"
url = "2"
tar = "0.4"
zstd = "0.13"
sha2 = "0.11"

# errors / logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# misc
getrandom = "0.4"
glob = "0.3"
libloading = "0.9"
libc = "0.2"

# dev
wiremock = "0.6"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
