[package]
name = "saladfingers-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "saladfingers: rent SaladCloud GPUs for minimum billed seconds."

[[bin]]
name = "saladfingers"
path = "src/main.rs"

[dependencies]
saladfingers-api = { workspace = true }
saladfingers-protocol = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "time",
  "signal",
] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
comfy-table = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
getrandom = { workspace = true }
humantime = { workspace = true }
reqwest = { workspace = true }
rusty-s3 = { workspace = true }
url = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
# `image push` writes the registry authfile + digestfile to a private temp dir.
tempfile = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
axum = { workspace = true }
